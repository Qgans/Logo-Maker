<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pro Logo Maker</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Audiowide&family=Bebas+Neue&family=Black+Ops+One&family=Bungee+Outline&family=Cinzel+Decorative:wght@700&family=Creepster&family=Faster+One&family=Megrim&family=Monofett&family=Monoton&family=Montserrat:wght@900&family=Nosifer&family=Plaster&family=Playfair+Display:ital,wght@1,900&family=Righteous&family=Russo+One&family=Syncopate:wght@700&family=Wallpoet&display=swap');

  body { 
    font-family: sans-serif; 
    background: #121212; 
    color: #fff;
    margin: 0; 
    padding: 20px; 
    display: flex; 
    flex-direction: column; 
    align-items: center; 
    touch-action: none; 
    min-height: 100vh;
    box-sizing: border-box;
  }

  /* Стили заставки */
  #splash-screen {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: #121212;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 9999;
    transition: opacity 0.6s ease-out;
  }
  
  #splash-screen h1 {
    font-family: 'Syncopate', sans-serif;
    font-size: 28px;
    margin: 0;
    text-align: center;
    letter-spacing: 2px;
  }
  
  #splash-screen p {
    font-family: 'Montserrat', sans-serif;
    font-size: 14px;
    color: #ff4757;
    margin-top: 10px;
    letter-spacing: 1px;
  }

  #workspace { 
    width: 320px; 
    height: 320px; 
    background: white; 
    border-radius: 12px; 
    box-shadow: 0 4px 20px rgba(0,0,0,0.5); 
    position: relative; 
    overflow: hidden; 
    margin-bottom: 20px;
    flex-shrink: 0;
  }

  .letter { 
    position: absolute; 
    line-height: 1; 
    user-select: none; 
    cursor: grab; 
    color: #1a1a1a; 
    top: 80px;
    transform-origin: center center;
    padding: 10px; 
    margin: -10px;
  }

  .active {
    outline: 2px dashed #ff4757;
    z-index: 100;
  }

  #l1 { left: 50px; }
  #l2 { left: 150px; }

  .controls { 
    width: 100%; 
    max-width: 320px; 
    display: flex;
    flex-direction: column;
    gap: 15px;
  }

  .input-row { display: flex; gap: 10px; }
  
  input[type="text"], select { 
    padding: 10px; 
    border: none; 
    border-radius: 6px; 
    font-size: 14px; 
    background: #2f3542;
    color: white;
    outline: none;
  }
  
  input[type="text"] { 
    width: 40px; 
    text-align: center; 
    text-transform: uppercase; 
    font-weight: bold;
  }
  
  select { flex-grow: 1; cursor: pointer; }

  .btn-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }

  .global-actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  button {
    background: #f1f2f6;
    color: #2f3542;
    border: none;
    padding: 12px 5px;
    border-radius: 8px;
    font-weight: bold;
    font-size: 12px;
    cursor: pointer;
    box-shadow: 0 2px 5px rgba(0,0,0,0.2);
  }

  button:active {
    background: #dfe4ea;
    transform: translateY(2px);
  }

  .action-btn { background: #eccc68; }
  .action-btn:active { background: #ffa502; }

  .export-btn {
    background: #ff4757;
    color: white;
    font-size: 14px;
    padding: 15px;
    margin-top: 5px;
  }
  
  .export-btn:active {
    background: #ff6b81;
  }

  #hint {
    display: none;
    color: #888;
    font-size: 14px;
    margin-top: 20px;
    text-align: center;
  }
</style>
</head>
<body>

<!-- Заставка -->
<div id="splash-screen">
  <h1>LOGO CREATOR</h1>
  <p>BY QGANS</p>
</div>

<div id="workspace">
  <div id="l1" class="letter active">B</div>
  <div id="l2" class="letter">S</div>
</div>

<div class="controls" id="controls-panel">
  <div class="input-row">
    <input type="text" id="input1" value="B" maxlength="1">
    <select id="font1">
      <optgroup label="Базовые">
        <option value="'Montserrat', sans-serif">Строгий (Montserrat)</option>
        <option value="'Bebas Neue', sans-serif">Высокий (Bebas)</option>
        <option value="'Playfair Display', serif">Классика (Playfair)</option>
      </optgroup>
      <optgroup label="Логотипные">
        <option value="'Syncopate', sans-serif">Широкий (Syncopate)</option>
        <option value="'Black Ops One', system-ui">Трафарет (Black Ops)</option>
        <option value="'Audiowide', sans-serif">Техно (Audiowide)</option>
        <option value="'Righteous', cursive">Плавный (Righteous)</option>
        <option value="'Russo One', sans-serif">Монолит (Russo One)</option>
        <option value="'Cinzel Decorative', serif">Элитный (Cinzel)</option>
      </optgroup>
      <optgroup label="Необычные">
        <option value="'Megrim', system-ui">Абстракция (Megrim)</option>
        <option value="'Plaster', system-ui">Трафарет 2 (Plaster)</option>
        <option value="'Bungee Outline', cursive">Контур (Bungee)</option>
        <option value="'Faster One', system-ui">Скорость (Faster)</option>
        <option value="'Wallpoet', system-ui">Урбан (Wallpoet)</option>
        <option value="'Monofett', cursive">Линии (Monofett)</option>
        <option value="'Monoton', cursive">Неоновый (Monoton)</option>
      </optgroup>
      <optgroup label="Дичь">
        <option value="'Creepster', cursive">Ужасы (Creepster)</option>
        <option value="'Nosifer', cursive">Хоррор (Nosifer)</option>
      </optgroup>
    </select>
  </div>
  <div class="input-row">
    <input type="text" id="input2" value="S" maxlength="1">
    <select id="font2">
      <optgroup label="Базовые">
        <option value="'Montserrat', sans-serif">Строгий (Montserrat)</option>
        <option value="'Bebas Neue', sans-serif">Высокий (Bebas)</option>
        <option value="'Playfair Display', serif">Классика (Playfair)</option>
      </optgroup>
      <optgroup label="Логотипные">
        <option value="'Syncopate', sans-serif">Широкий (Syncopate)</option>
        <option value="'Black Ops One', system-ui">Трафарет (Black Ops)</option>
        <option value="'Audiowide', sans-serif">Техно (Audiowide)</option>
        <option value="'Righteous', cursive">Плавный (Righteous)</option>
        <option value="'Russo One', sans-serif">Монолит (Russo One)</option>
        <option value="'Cinzel Decorative', serif">Элитный (Cinzel)</option>
      </optgroup>
      <optgroup label="Необычные">
        <option value="'Megrim', system-ui">Абстракция (Megrim)</option>
        <option value="'Plaster', system-ui">Трафарет 2 (Plaster)</option>
        <option value="'Bungee Outline', cursive">Контур (Bungee)</option>
        <option value="'Faster One', system-ui">Скорость (Faster)</option>
        <option value="'Wallpoet', system-ui">Урбан (Wallpoet)</option>
        <option value="'Monofett', cursive">Линии (Monofett)</option>
        <option value="'Monoton', cursive">Неоновый (Monoton)</option>
      </optgroup>
      <optgroup label="Дичь">
        <option value="'Creepster', cursive">Ужасы (Creepster)</option>
        <option value="'Nosifer', cursive">Хоррор (Nosifer)</option>
      </optgroup>
    </select>
  </div>

  <div class="btn-grid">
    <button onclick="applyAction('rot', -30)">↺ -30°</button>
    <button onclick="applyAction('rot', 30)">↻ +30°</button>
    <button onclick="applyAction('size', 10)">+ SIZE</button>
    <button onclick="applyAction('size', -10)">- SIZE</button>
    <button onclick="applyAction('flipH')">⇆ FLIP H</button>
    <button onclick="applyAction('flipV')">⇅ FLIP V</button>
  </div>
  
  <div class="global-actions">
    <button class="action-btn" onclick="selectAll()">ВЫБРАТЬ ВСЁ</button>
    <button class="action-btn" onclick="centerLogo()">В ЦЕНТР</button>
  </div>

  <button class="export-btn" onclick="prepareForScreenshot()">ПОДГОТОВИТЬ К СКРИНШОТУ</button>
</div>

<div id="hint">Делай скриншот.<br>Тапни здесь или по черному фону, чтобы вернуть меню.</div>

<script>
  // Логика заставки
  window.addEventListener('load', () => {
    setTimeout(() => {
      const splash = document.getElementById('splash-screen');
      splash.style.opacity = '0'; // Плавно делаем прозрачным
      setTimeout(() => {
        splash.style.display = 'none'; // Полностью убираем, чтобы не мешало кликать
      }, 600); // Ждем пока закончится анимация прозрачности (соответствует CSS transition)
    }, 2000); // 2 секунды показа
  });

  const state = {
    l1: { size: 140, rot: 0, flipH: 1, flipV: 1, family: "'Montserrat', sans-serif" },
    l2: { size: 140, rot: 0, flipH: 1, flipV: 1, family: "'Montserrat', sans-serif" }
  };

  let activeId = 'l1'; 

  const l1 = document.getElementById('l1');
  const l2 = document.getElementById('l2');
  const workspace = document.getElementById('workspace');
  const controlsPanel = document.getElementById('controls-panel');
  const hint = document.getElementById('hint');
  
  updateStyle('l1');
  updateStyle('l2');

  function updateStyle(id) {
    const el = document.getElementById(id);
    const s = state[id];
    el.style.fontSize = s.size + 'px';
    el.style.fontFamily = s.family;
    el.style.transform = `rotate(${s.rot}deg) scale(${s.flipH}, ${s.flipV})`;
  }

  document.getElementById('input1').addEventListener('input', (e) => l1.textContent = e.target.value.toUpperCase());
  document.getElementById('input2').addEventListener('input', (e) => l2.textContent = e.target.value.toUpperCase());

  document.getElementById('font1').addEventListener('change', (e) => { state.l1.family = e.target.value; updateStyle('l1'); });
  document.getElementById('font2').addEventListener('change', (e) => { state.l2.family = e.target.value; updateStyle('l2'); });

  function setActive(id) {
    activeId = id;
    l1.classList.remove('active');
    l2.classList.remove('active');
    
    if (id === 'all') {
      l1.classList.add('active');
      l2.classList.add('active');
    } else {
      document.getElementById(id).classList.add('active');
    }
  }

  window.selectAll = function() {
    setActive('all');
  };

  window.applyAction = function(action, val) {
    const targets = activeId === 'all' ? ['l1', 'l2'] : [activeId];
    
    targets.forEach(id => {
      const s = state[id];
      if (action === 'rot') s.rot += val;
      if (action === 'size') s.size += val;
      if (action === 'flipH') s.flipH *= -1;
      if (action === 'flipV') s.flipV *= -1;
      updateStyle(id);
    });
  };

  window.centerLogo = function() {
    const r1 = l1.getBoundingClientRect();
    const r2 = l2.getBoundingClientRect();
    const w = workspace.getBoundingClientRect();
    
    const minX = Math.min(r1.left, r2.left) - w.left;
    const minY = Math.min(r1.top, r2.top) - w.top;
    const maxX = Math.max(r1.right, r2.right) - w.left;
    const maxY = Math.max(r1.bottom, r2.bottom) - w.top;

    const currentCX = (minX + maxX) / 2;
    const currentCY = (minY + maxY) / 2;

    const targetCX = w.width / 2;
    const targetCY = w.height / 2;

    const dx = targetCX - currentCX;
    const dy = targetCY - currentCY;

    l1.style.left = (l1.offsetLeft + dx) + 'px';
    l1.style.top = (l1.offsetTop + dy) + 'px';
    l2.style.left = (l2.offsetLeft + dx) + 'px';
    l2.style.top = (l2.offsetTop + dy) + 'px';
  };

  function makeDraggable(el, id) {
    let isDragging = false, isMoved = false, startX, startY, initX1, initY1, initX2, initY2;

    function start(e) {
      isDragging = true;
      isMoved = false; 
      let clientX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
      let clientY = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;
      startX = clientX;
      startY = clientY;
      
      initX1 = l1.offsetLeft;
      initY1 = l1.offsetTop;
      initX2 = l2.offsetLeft;
      initY2 = l2.offsetTop;
      
      el.style.cursor = 'grabbing';
      
      if (activeId !== 'all') {
        setActive(id);
      }
    }

    function move(e) {
      if (!isDragging) return;
      let clientX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
      let clientY = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;
      
      let dx = clientX - startX;
      let dy = clientY - startY;

      if (Math.abs(dx) > 3 || Math.abs(dy) > 3) {
        isMoved = true;
      }

      if (!isMoved) return; 

      e.preventDefault(); 
      
      if (activeId === 'all') {
        l1.style.left = (initX1 + dx) + 'px';
        l1.style.top = (initY1 + dy) + 'px';
        l2.style.left = (initX2 + dx) + 'px';
        l2.style.top = (initY2 + dy) + 'px';
      } else {
        let targetEl = id === 'l1' ? l1 : l2;
        let initX = id === 'l1' ? initX1 : initX2;
        let initY = id === 'l1' ? initY1 : initY2;
        
        targetEl.style.left = (initX + dx) + 'px';
        targetEl.style.top = (initY + dy) + 'px';
      }
    }

    function end() {
      if (!isDragging) return;
      isDragging = false;
      el.style.cursor = 'grab';

      if (!isMoved) {
        setActive(id);
      }
    }

    el.addEventListener('mousedown', start);
    document.addEventListener('mousemove', move);
    document.addEventListener('mouseup', end);
    el.addEventListener('touchstart', start, {passive: false});
    document.addEventListener('touchmove', move, {passive: false});
    document.addEventListener('touchend', end);
  }

  makeDraggable(l1, 'l1');
  makeDraggable(l2, 'l2');

  window.prepareForScreenshot = function() {
    const l1WasActive = l1.classList.contains('active');
    const l2WasActive = l2.classList.contains('active');
    l1.classList.remove('active');
    l2.classList.remove('active');

    controlsPanel.style.display = 'none';
    hint.style.display = 'block';

    function restoreUI(e) {
      if (!workspace.contains(e.target)) {
        controlsPanel.style.display = 'flex';
        hint.style.display = 'none';
        
        if (l1WasActive) l1.classList.add('active');
        if (l2WasActive) l2.classList.add('active');
        
        document.removeEventListener('pointerdown', restoreUI);
      }
    }

    setTimeout(() => {
      document.addEventListener('pointerdown', restoreUI);
    }, 100);
  };
</script>
</body>
</html>
